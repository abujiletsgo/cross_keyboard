CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_INPUT=y
CONFIG_INPUT_AZOTEQ_IQS5XX=y

# Pointing (mouse) HID — must be in side-specific conf for the right
# (central) side to actually advertise mouse HID to the host.
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_ZMK_SLEEP=y
# Deep sleep after 1 h idle (default 15 min). Waking from deep sleep is a full
# reboot + BLE reconnect (seconds), so keep the link up through normal breaks.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=4096

# Logging for diagnosis
CONFIG_BOOT_BANNER=y
CONFIG_LOG_DEFAULT_LEVEL=3
